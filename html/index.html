<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora</title>

    <!-- CDN link CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">

    <!-- CSS link -->
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>

    <!-- Botão de tema claro e escuro -->
    <div class="d-flex justify-content-end mb-3 me-3 mt-4">
        <button type="button" id="btn-tema" class="btn btn-outline-secondary btn-md">🌙 Modo Escuro</button>
    </div>

    <main class="container calculadora-container mb-5">
        <h1 class="text-center mb-4">Divirta-se!</h1>

        <div class="row justify-content-center align-items-start g-4">

            <!-- Calculadora -->
            <div class="col-12 col-md-7 col-lg-5 calculadora-coluna">
                <section class="card" id="calculadora">
                    <div class="card-body">

                        <!-- Visor -->
                        <input type="text" id="visor" class="form-control text-end mb-3" value="0" readonly>

                        <!-- Easter egg -->
                        <div id="easter-egg" class="easter-egg d-none" aria-live="polite">
                            <video id="easter-egg-video" muted playsinline loop preload="auto"></video>
                        </div>

                        <!-- Linha 1 -->
                        <div class="row g-2">
                            <div class="col"><button type="button" class="btn btn-secondary w-100 btn-calculadora">7</button></div>
                            <div class="col"><button type="button" class="btn btn-secondary w-100 btn-calculadora">8</button></div>
                            <div class="col"><button type="button" class="btn btn-secondary w-100 btn-calculadora">9</button></div>
                            <div class="col"><button type="button" class="btn btn-primary w-100 btn-calculadora">/</button></div>
                        </div>

                        <!-- Linha 2 -->
                        <div class="row g-2 mt-1">
                            <div class="col"><button type="button" class="btn btn-secondary w-100 btn-calculadora">4</button></div>
                            <div class="col"><button type="button" class="btn btn-secondary w-100 btn-calculadora">5</button></div>
                            <div class="col"><button type="button" class="btn btn-secondary w-100 btn-calculadora">6</button></div>
                            <div class="col"><button type="button" class="btn btn-primary w-100 btn-calculadora">*</button></div>
                        </div>

                        <!-- Linha 3 -->
                        <div class="row g-2 mt-1">
                            <div class="col"><button type="button" class="btn btn-secondary w-100 btn-calculadora">1</button></div>
                            <div class="col"><button type="button" class="btn btn-secondary w-100 btn-calculadora">2</button></div>
                            <div class="col"><button type="button" class="btn btn-secondary w-100 btn-calculadora">3</button></div>
                            <div class="col"><button type="button" class="btn btn-primary w-100 btn-calculadora">-</button></div>
                        </div>

                        <!-- Linha 4 -->
                        <div class="row g-2 mt-1">
                            <div class="col"><button type="button" class="btn btn-danger w-100 btn-calculadora">AC</button></div>
                            <div class="col"><button type="button" class="btn btn-secondary w-100 btn-calculadora">⌫</button></div>
                            <div class="col"><button type="button" class="btn btn-secondary w-100 btn-calculadora">0</button></div>
                            <div class="col"><button type="button" class="btn btn-secondary w-100 btn-calculadora">=</button></div>
                            <div class="col"><button type="button" class="btn btn-primary w-100 btn-calculadora">+</button></div>
                        </div>

                        <button type="button" id="btn-desafio" class="btn btn-success w-100 mt-3">Modo Desafio</button>
                    </div>
                </section>
            </div>

            <!-- Área do desafio -->
            <div class="col-12 col-md-7 col-lg-5 d-none" id="area-desafio">
                <section class="card desafio-card">
                    <div class="card-body">

                        <div class="d-flex justify-content-between align-items-center mb-3 gap-3">
                            <h2 class="h4 mb-0">Desafio Matemático</h2>
                            <button type="button" id="btn-sair" class="btn btn-outline-secondary btn-sm">Sair do desafio</button>
                        </div>

                        <!-- Questão atual -->
                        <div id="tela-questao">
                            <p class="contador-questao mb-2">
                                Questão <strong id="numero-questao">1</strong> de <strong id="total-questoes">5</strong>
                            </p>

                            <p class="pergunta-desafio" id="pergunta"></p>

                            <form id="form-desafio" class="mb-3">
                                <label for="resposta" class="form-label">Resposta:</label>
                                <div class="input-group">
                                    <input type="number" step="any" id="resposta" class="form-control" autocomplete="off" required>
                                    <button type="submit" class="btn btn-primary">Enviar</button>
                                </div>
                            </form>

                            <div id="feedback" class="feedback mt-2"></div>

                            <div class="area-tempo mt-4">
                                <div class="d-flex justify-content-between align-items-center mb-2">
                                    <span>Tempo restante:</span>
                                    <strong id="tempo">15s</strong>
                                </div>

                                <div class="progress" role="progressbar" aria-label="Tempo restante" aria-valuemin="0" aria-valuemax="15">
                                    <div id="barra-tempo" class="progress-bar" style="width: 100%"></div>
                                </div>
                            </div>
                        </div>

                        <!-- Tela final -->
                        <div id="tela-final" class="text-center d-none">
                            <h3 id="titulo-final">Fim de jogo!</h3>
                            <p id="mensagem-final" class="mt-3"></p>
                            <p>Acertos: <strong id="final-acertos">0</strong></p>
                            <button type="button" id="btn-jogar-novamente" class="btn btn-success mt-2">Jogar novamente</button>
                        </div>

                    </div>
                </section>
            </div>

        </div>
    </main>

    <!-- som do cronômetro -->
    <audio id="som-tic-tac" src="../assets/audio/tic-tac.mp3" loop preload="auto"></audio>

    <!-- som dos Easter eggs -->
    <audio id="som-easter-egg" preload="auto"></audio>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

    <!-- JavaScript -->
    <script src="../scripts/scripts.js"></script>
</body>
</html>
